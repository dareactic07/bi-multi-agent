name: CI Pipeline

on:
  push:
    branches: [main, "feat/*"]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Pytest & AST Validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: olist_admin
          POSTGRES_PASSWORD: olist_secure_password_123
          POSTGRES_DB: olist_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PostgreSQL Schema & Readonly User
        run: |
          docker exec -i ${{ job.services.postgres.id }} psql -U olist_admin -d olist_db < docker/init.sql
          docker exec -i ${{ job.services.postgres.id }} psql -U olist_admin -d olist_db < backend/app/db/schema.sql

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          uv pip install --system -r backend/requirements.txt

      - name: Run Pytest Suite
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: olist_db
          POSTGRES_USER: olist_admin
          POSTGRES_PASSWORD: olist_secure_password_123
          READONLY_USER: olist_readonly
          READONLY_PASSWORD: readonly_secure_password_123
        run: |
          pytest -v

  frontend-build:
    name: Frontend TypeScript & Next.js Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build Next.js Production App
        working-directory: ./frontend
        run: npm run build
